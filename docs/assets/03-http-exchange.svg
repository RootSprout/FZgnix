<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6 1 11Z" fill="#42627a"/></marker><style>
text{font-family:Inter,Arial,sans-serif;fill:#183247}.title{font-size:36px;font-weight:700}.sub{font-size:18px;fill:#526d80}.label{font-size:18px;font-weight:700}.mono{font-family:Menlo,Consolas,monospace;font-size:18px}.small{font-size:16px;fill:#526d80}.box{fill:#fff;stroke:#a9bfce;stroke-width:2;rx:16}.req{fill:#e7f3fb;stroke:#62a7d2}.resp{fill:#e6f7f4;stroke:#54b5a5}.wire{stroke:#42627a;stroke-width:3;fill:none;marker-end:url(#a)}
</style></defs>
<rect width="1500" height="820" fill="#f4f8fb"/><text x="70" y="70" class="title">What curl sends — and what the server returns</text><text x="70" y="108" class="sub">The HTTP message is text on a TCP connection. The parser in this project reads just the request line and header terminator.</text>
<rect x="70" y="160" width="640" height="520" class="box req"/><text x="105" y="205" class="label">CLIENT REQUEST · curl -i http://127.0.0.1:8080/</text>
<text x="105" y="270" class="mono">GET / HTTP/1.1</text><text x="105" y="312" class="mono">Host: 127.0.0.1:8080</text><text x="105" y="354" class="mono">User-Agent: curl/…</text><text x="105" y="396" class="mono">Accept: */*</text><text x="105" y="438" class="mono">headers end: CRLF CRLF</text>
<line x1="105" y1="475" x2="670" y2="475" stroke="#b6cad8" stroke-width="2"/><text x="105" y="520" class="small">Parser extracts:</text><text x="105" y="555" class="mono">method = GET</text><text x="105" y="590" class="mono">target = /</text><text x="105" y="625" class="mono">version = HTTP/1.1</text><text x="105" y="655" class="small">Header names and body are not parsed in this milestone.</text>
<path d="M710 420H790" class="wire"/><text x="750" y="395" text-anchor="middle" class="small">server</text>
<rect x="790" y="160" width="640" height="520" class="box resp"/><text x="825" y="205" class="label">SERVER RESPONSE · visible because curl uses -i</text>
<text x="825" y="270" class="mono">HTTP/1.1 200 OK</text><text x="825" y="312" class="mono">Content-Type: text/plain; charset=utf-8</text><text x="825" y="354" class="mono">Content-Length: 26</text><text x="825" y="396" class="mono">Connection: close</text><text x="825" y="438" class="mono">headers end: CRLF CRLF</text><text x="825" y="490" class="mono">hello from the ngnix core</text>
<line x1="825" y1="525" x2="1390" y2="525" stroke="#b6d7d0" stroke-width="2"/><text x="825" y="570" class="small">200 = success · 404 = no module claimed the path</text><text x="825" y="605" class="small">405 = method unsupported · 400 = malformed or oversized headers</text><text x="825" y="645" class="small">HEAD returns headers with a zero-length body.</text>
<text x="70" y="740" class="small">The final blank line separates HTTP headers from the body. Content-Length counts body bytes, not the headers.</text>
</svg>
