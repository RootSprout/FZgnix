<svg xmlns="http://www.w3.org/2000/svg" width="2960" height="1450" viewBox="0 0 2960 1450">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4f7192"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#4c8c68"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#8065aa"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #20344d; }
      .title { font-size: 42px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #58708a; }
      .section { font-size: 21px; font-weight: 700; fill: #38536f; letter-spacing: 1px; }
      .node-title { font-size: 19px; font-weight: 650; }
      .node-sub { font-size: 15px; fill: #58708a; }
      .note { font-size: 16px; fill: #4d647c; }
      .edge-label { font-size: 15px; font-weight: 600; fill: #4d647c; }
      .control { fill: #eaf2fb; stroke: #6093c3; }
      .core { fill: #edf6ef; stroke: #70a77d; }
      .http { fill: #f3eefb; stroke: #9679bf; }
      .transport { fill: #ffffff; stroke: #91a9c1; }
      .memory { fill: #eaf5ef; stroke: #5a9a75; }
      .client { fill: #fff6df; stroke: #d1aa4f; }
      .cleanup { fill: #fbefef; stroke: #c87979; }
      .arrow { fill: none; stroke: #4f7192; stroke-width: 3; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #4c8c68; stroke-width: 3; marker-end: url(#arrow-green); }
      .arrow-purple { fill: none; stroke: #8065aa; stroke-width: 3; marker-end: url(#arrow-purple); }
      .control-edge { fill: none; stroke: #7092b2; stroke-width: 2.5; stroke-dasharray: 9 8; marker-end: url(#arrow-blue); }
    </style>
  </defs>
  <rect width="2960" height="1450" fill="#f5f8fc"/>
  <text x="90" y="78" class="title">NGNIX — Current C Architecture</text>
  <text x="92" y="115" class="subtitle">A small, single-process HTTP server organized around a core cycle, modules, request pools, and a poll-based event loop</text>

  <rect x="55" y="150" width="2850" height="360" rx="22" fill="#eef3f9" stroke="#d5e0eb"/>
  <text x="85" y="190" class="section">STARTUP AND CONTROL PLANE</text>

  <g>
    <rect x="90" y="235" width="230" height="100" rx="16" class="control" stroke-width="2.5"/>
    <text x="205" y="275" text-anchor="middle" class="node-title">CLI</text>
    <text x="205" y="305" text-anchor="middle" class="node-sub">src/main.c</text>
  </g>
  <g>
    <rect x="390" y="235" width="280" height="100" rx="16" class="control" stroke-width="2.5"/>
    <text x="530" y="275" text-anchor="middle" class="node-title">Core cycle</text>
    <text x="530" y="305" text-anchor="middle" class="node-sub">src/core/cycle.c</text>
  </g>
  <g>
    <path d="M90 385 H295 L320 410 V470 H90 Z" fill="#fff6df" stroke="#d1aa4f" stroke-width="2.5"/>
    <text x="200" y="425" text-anchor="middle" class="node-title">ngnix.conf</text>
    <text x="200" y="450" text-anchor="middle" class="node-sub">sample settings</text>
  </g>
  <g>
    <rect x="390" y="370" width="280" height="100" rx="16" class="transport" stroke-width="2.5"/>
    <text x="530" y="410" text-anchor="middle" class="node-title">Config defaults + loader</text>
    <text x="530" y="440" text-anchor="middle" class="node-sub">src/core/config.c</text>
  </g>
  <g>
    <rect x="750" y="370" width="255" height="100" rx="16" class="core" stroke-width="2.5"/>
    <text x="877" y="410" text-anchor="middle" class="node-title">Runtime settings</text>
    <text x="877" y="440" text-anchor="middle" class="node-sub">ng_config_t</text>
  </g>
  <g>
    <rect x="750" y="235" width="230" height="90" rx="16" class="core" stroke-width="2.5"/>
    <text x="865" y="272" text-anchor="middle" class="node-title">Logger</text>
    <text x="865" y="300" text-anchor="middle" class="node-sub">src/core/log.c</text>
  </g>
  <g>
    <rect x="1050" y="235" width="260" height="90" rx="16" class="core" stroke-width="2.5"/>
    <text x="1180" y="272" text-anchor="middle" class="node-title">Module registry</text>
    <text x="1180" y="300" text-anchor="middle" class="node-sub">src/core/module.c</text>
  </g>
  <g>
    <rect x="1410" y="235" width="330" height="115" rx="16" class="control" stroke-width="2.5"/>
    <text x="1575" y="280" text-anchor="middle" class="node-title">poll(2) event loop</text>
    <text x="1575" y="312" text-anchor="middle" class="node-sub">src/event/poll_backend.c</text>
  </g>
  <g>
    <rect x="1840" y="235" width="280" height="115" rx="16" class="transport" stroke-width="2.5"/>
    <text x="1980" y="280" text-anchor="middle" class="node-title">Unix socket setup</text>
    <text x="1980" y="312" text-anchor="middle" class="node-sub">src/os/unix/socket.c</text>
  </g>
  <g>
    <rect x="2220" y="235" width="300" height="115" rx="16" class="transport" stroke-width="2.5"/>
    <text x="2370" y="280" text-anchor="middle" class="node-title">Non-blocking listener</text>
    <text x="2370" y="312" text-anchor="middle" class="node-sub">IPv4 TCP · 0.0.0.0:port</text>
  </g>
  <g>
    <rect x="2570" y="235" width="270" height="115" rx="16" class="core" stroke-width="2.5"/>
    <text x="2705" y="280" text-anchor="middle" class="node-title">Build-time modules</text>
    <text x="2705" y="312" text-anchor="middle" class="node-sub">static registration</text>
  </g>

  <path d="M320 285 H390" class="arrow"/>
  <path d="M320 425 H355 V420 H390" class="arrow"/>
  <path d="M530 335 V370" class="arrow"/>
  <path d="M670 420 H750" class="arrow"/>
  <path d="M670 285 H710 V280 H750" class="arrow"/>
  <path d="M670 285 H705 V215 H1050 V235" class="arrow"/>
  <path d="M980 280 H1410" class="arrow"/>
  <path d="M1005 420 H1350 V320 H1410" class="arrow"/>
  <path d="M1740 292 H1840" class="arrow"/>
  <path d="M2120 292 H2220" class="arrow"/>
  <path d="M2705 350 V490 H1580 V660" class="control-edge"/>
  <text x="2740" y="475" class="edge-label">handlers</text>

  <rect x="55" y="535" width="2850" height="430" rx="22" fill="#ffffff" stroke="#d5e0eb"/>
  <text x="85" y="580" class="section">HTTP REQUEST AND RESPONSE PATH</text>

  <g>
    <rect x="70" y="675" width="220" height="120" rx="18" class="client" stroke-width="2.5"/>
    <text x="180" y="720" text-anchor="middle" class="node-title">Client</text>
    <text x="180" y="752" text-anchor="middle" class="node-sub">HTTP request</text>
  </g>
  <g>
    <rect x="355" y="675" width="230" height="120" rx="16" class="transport" stroke-width="2.5"/>
    <text x="470" y="720" text-anchor="middle" class="node-title">Listen socket</text>
    <text x="470" y="752" text-anchor="middle" class="node-sub">ready via POLLIN</text>
  </g>
  <g>
    <rect x="650" y="675" width="220" height="120" rx="16" class="transport" stroke-width="2.5"/>
    <text x="760" y="720" text-anchor="middle" class="node-title">Accept client</text>
    <text x="760" y="752" text-anchor="middle" class="node-sub">bounded slots</text>
  </g>
  <g>
    <rect x="935" y="675" width="240" height="120" rx="16" class="core" stroke-width="2.5"/>
    <text x="1055" y="720" text-anchor="middle" class="node-title">Connection state</text>
    <text x="1055" y="752" text-anchor="middle" class="node-sub">fd + request buffer</text>
  </g>
  <g>
    <rect x="1240" y="675" width="230" height="120" rx="16" class="http" stroke-width="2.5"/>
    <text x="1355" y="720" text-anchor="middle" class="node-title">HTTP parser</text>
    <text x="1355" y="752" text-anchor="middle" class="node-sub">request line + headers end</text>
  </g>
  <g>
    <rect x="1535" y="675" width="230" height="120" rx="16" class="http" stroke-width="2.5"/>
    <text x="1650" y="720" text-anchor="middle" class="node-title">Module dispatch</text>
    <text x="1650" y="752" text-anchor="middle" class="node-sub">first handler to claim</text>
  </g>
  <g>
    <rect x="1830" y="675" width="235" height="120" rx="16" class="http" stroke-width="2.5"/>
    <text x="1947" y="720" text-anchor="middle" class="node-title">Built-in HTTP module</text>
    <text x="1947" y="752" text-anchor="middle" class="node-sub">GET / HEAD: /, /health</text>
  </g>
  <g>
    <rect x="2130" y="675" width="230" height="120" rx="16" class="transport" stroke-width="2.5"/>
    <text x="2245" y="720" text-anchor="middle" class="node-title">Response builder</text>
    <text x="2245" y="752" text-anchor="middle" class="node-sub">status + headers + body</text>
  </g>
  <g>
    <rect x="2425" y="675" width="220" height="120" rx="16" class="transport" stroke-width="2.5"/>
    <text x="2535" y="720" text-anchor="middle" class="node-title">Partial send</text>
    <text x="2535" y="752" text-anchor="middle" class="node-sub">resume on POLLOUT</text>
  </g>
  <g>
    <rect x="2700" y="675" width="175" height="120" rx="18" class="client" stroke-width="2.5"/>
    <text x="2787" y="720" text-anchor="middle" class="node-title">Client</text>
    <text x="2787" y="752" text-anchor="middle" class="node-sub">response</text>
  </g>

  <path d="M290 735 H355" class="arrow-green"/>
  <path d="M585 735 H650" class="arrow-green"/>
  <path d="M870 735 H935" class="arrow-green"/>
  <path d="M1175 735 H1240" class="arrow-purple"/>
  <path d="M1470 735 H1535" class="arrow-purple"/>
  <path d="M1765 735 H1830" class="arrow-purple"/>
  <path d="M2065 735 H2130" class="arrow-purple"/>
  <path d="M2360 735 H2425" class="arrow-green"/>
  <path d="M2645 735 H2700" class="arrow-green"/>
  <path d="M470 350 V625 H470 V675" class="arrow"/>
  <path d="M1180 280 H1310 V625 H1650 V675" class="control-edge"/>
  <text x="1490" y="615" class="edge-label">module registry</text>
  <path d="M1575 350 V430 H760 V675" class="control-edge"/>
  <path d="M1575 430 H1055 V675" class="control-edge"/>
  <path d="M1575 430 H1355 V675" class="control-edge"/>
  <path d="M1575 430 H2535 V675" class="control-edge"/>
  <text x="1600" y="420" class="edge-label">poll monitors listener and client readiness</text>

  <rect x="55" y="990" width="2850" height="365" rx="22" fill="#eef6f0" stroke="#cfe0d2"/>
  <text x="85" y="1035" class="section">REQUEST MEMORY LIFETIME</text>
  <g>
    <rect x="710" y="1080" width="410" height="130" rx="18" class="memory" stroke-width="2.5"/>
    <text x="915" y="1128" text-anchor="middle" class="node-title">Per-connection memory pool</text>
    <text x="915" y="1160" text-anchor="middle" class="node-sub">arena blocks + tracked large allocations</text>
    <text x="915" y="1185" text-anchor="middle" class="node-sub">src/core/pool.c</text>
  </g>
  <g>
    <rect x="1280" y="1080" width="420" height="130" rx="18" class="cleanup" stroke-width="2.5"/>
    <text x="1490" y="1128" text-anchor="middle" class="node-title">Connection closes</text>
    <text x="1490" y="1160" text-anchor="middle" class="node-sub">response sent, peer closed, or error</text>
    <text x="1490" y="1185" text-anchor="middle" class="node-sub">close fd + destroy pool</text>
  </g>
  <text x="1810" y="1120" class="note">Request strings and assembled response bytes share this lifetime.</text>
  <text x="1810" y="1155" class="note">A single pool destroy releases all allocations for that connection.</text>

  <path d="M1055 795 V900 H915 V1080" class="arrow-green"/>
  <path d="M1355 795 V945 H915 V1080" class="arrow-purple"/>
  <path d="M2245 795 V930 H1120 V1145 H1280" class="arrow-green"/>
  <path d="M2535 795 V900 H1490 V1080" class="arrow-green"/>
  <path d="M1120 1145 H1280" class="arrow-green"/>
  <text x="1150" y="925" class="edge-label">parser allocations</text>
  <text x="2110" y="915" class="edge-label">response completed</text>

  <circle cx="95" cy="1395" r="9" fill="#6093c3"/><text x="115" y="1401" class="note">startup/control</text>
  <circle cx="300" cy="1395" r="9" fill="#70a77d"/><text x="320" y="1401" class="note">core + memory</text>
  <circle cx="525" cy="1395" r="9" fill="#9679bf"/><text x="545" y="1401" class="note">HTTP processing</text>
  <path d="M780 1395 H840" class="control-edge"/><text x="855" y="1401" class="note">event readiness</text>
  <text x="2810" y="1401" text-anchor="end" class="note">Current implementation · one request per connection</text>
</svg>
